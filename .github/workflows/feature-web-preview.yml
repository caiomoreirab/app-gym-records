name: GymRecords - Prévia isolada da branch
on:
  push:
    branches: ['feat/registro-sessoes-validacao']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/feature-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gymrecords-web-preview
  cancel-in-progress: true

jobs:
  build-and-deploy-review:
    name: Publicar estável + review na mesma página
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: https://caiomoreirab.github.io/app-gym-records/review/
    steps:
      - name: Buscar main estável
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Buscar branch de validação
        uses: actions/checkout@v4
        with:
          ref: feat/registro-sessoes-validacao
          path: review

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Compilar main estável
        working-directory: stable
        env:
          FB_API_KEY: ${{ vars.GYM_FIREBASE_API_KEY }}
          FB_APP_ID: ${{ vars.GYM_FIREBASE_WEB_APP_ID }}
          FB_PROJECT_ID: ${{ vars.GYM_FIREBASE_PROJECT_ID }}
          FB_SENDER_ID: ${{ vars.GYM_FIREBASE_SENDER_ID }}
          FB_MEASUREMENT_ID: ${{ vars.GYM_FIREBASE_WEB_MEASUREMENT_ID }}
        run: |
          flutter create --platforms=web --project-name=gymrecords --no-pub .
          flutter pub get
          flutter build web --release --base-href "/app-gym-records/" --web-content-hash \
            --dart-define="GYM_FIREBASE_API_KEY=$FB_API_KEY" \
            --dart-define="GYM_FIREBASE_APP_ID=$FB_APP_ID" \
            --dart-define="GYM_FIREBASE_PROJECT_ID=$FB_PROJECT_ID" \
            --dart-define="GYM_FIREBASE_SENDER_ID=$FB_SENDER_ID" \
            --dart-define="GYM_FIREBASE_MEASUREMENT_ID=$FB_MEASUREMENT_ID"

      - name: Compilar branch de validação
        working-directory: review
        run: |
          flutter create --platforms=web --project-name=gymrecords --no-pub .
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded
          flutter build web --release --base-href "/app-gym-records/review/" --web-content-hash

      - name: Empacotar os dois sites
        run: |
          mkdir -p site/review
          cp -a stable/build/web/. site/
          cp -a review/build/web/. site/review/
          cp stable/docs/privacy.html site/privacy.html
          touch site/.nojekyll
          cp site/index.html site/404.html
          test -s site/index.html
          test -s site/review/index.html

      - name: Publicar artefato GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Implantar site com review
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mostrar URL de validação
        run: |
          echo "### GymRecords — review" >> "$GITHUB_STEP_SUMMARY"
          echo "https://caiomoreirab.github.io/app-gym-records/review/" >> "$GITHUB_STEP_SUMMARY"
          echo "Versão estável preservada em https://caiomoreirab.github.io/app-gym-records/" >> "$GITHUB_STEP_SUMMARY"
