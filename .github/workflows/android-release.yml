name: GymRecords - AAB de publicação (assinado)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-android-bundle:
    name: Gerar Android App Bundle assinado
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GYM_UPLOAD_KEYSTORE_B64: ${{ secrets.GYM_UPLOAD_KEYSTORE_B64 }}
      GYM_UPLOAD_STORE_PASSWORD: ${{ secrets.GYM_UPLOAD_STORE_PASSWORD }}
      GYM_UPLOAD_KEY_PASSWORD: ${{ secrets.GYM_UPLOAD_KEY_PASSWORD }}
      GYM_UPLOAD_KEY_ALIAS: ${{ secrets.GYM_UPLOAD_KEY_ALIAS }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar assinatura de publicação
        shell: bash
        run: |
          test -n "$GYM_UPLOAD_KEYSTORE_B64" || { echo "::error::Falta GYM_UPLOAD_KEYSTORE_B64"; exit 1; }
          test -n "$GYM_UPLOAD_STORE_PASSWORD" || { echo "::error::Falta GYM_UPLOAD_STORE_PASSWORD"; exit 1; }
          test -n "$GYM_UPLOAD_KEY_PASSWORD" || { echo "::error::Falta GYM_UPLOAD_KEY_PASSWORD"; exit 1; }
          test -n "$GYM_UPLOAD_KEY_ALIAS" || { echo "::error::Falta GYM_UPLOAD_KEY_ALIAS"; exit 1; }

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Criar keystore temporário de upload
        shell: bash
        run: |
          echo "$GYM_UPLOAD_KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$GYM_UPLOAD_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$GYM_UPLOAD_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$GYM_UPLOAD_KEY_ALIAS"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Executar testes
        run: flutter test --reporter expanded

      - name: Compilar AAB assinado
        run: flutter build appbundle --release

      - name: Verificar artefato
        run: test -s build/app/outputs/bundle/release/app-release.aab

      - name: Disponibilizar AAB
        uses: actions/upload-artifact@v4
        with:
          name: GymRecords-release-signed-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

      - name: Limpar chave de upload do executor
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks android/key.properties
